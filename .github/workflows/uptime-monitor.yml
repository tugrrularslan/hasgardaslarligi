name: Site erişim izleme

on:
  schedule:
    # Saat başındaki yoğunluktan kaçınarak, her 5 dakikada bir (UTC) çalışır.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5
      - name: Ana sayfanın erişilebilirliğini denetle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.UPTIME_SITE_URL || 'https://hasgardaslarligi.vercel.app' }}
        run: node scripts/uptime-monitor.mjs
